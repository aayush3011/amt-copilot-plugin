name: Memory House plugin
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22]
        include:
          - os: ubuntu-latest
            node: 20
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: .maintainer/package-lock.json
      - run: npm ci --prefix .maintainer --ignore-scripts --no-audit --no-fund
      - run: npm run check:bundle
      - run: npm run check
      - run: npm test
      - run: npm run check:publisher
